<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holistic Investment Terminal</title>
<meta name="description" content="Holistic company analysis and investment decision terminal for Indian listed equities.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script src="/vendor/chart.umd.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div id="shell" class="shell" hidden>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle navigation">☰</button>
    <a href="#/home" class="brand"><span class="brand-mark">◆</span> Holistic Terminal</a>
    <form class="top-search" id="topSearch" role="search"><input type="search" name="q" placeholder="Search company, ticker, ISIN…" aria-label="Search companies"></form>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">◐</button>
    <a href="#/watchlist" class="icon-btn alert-btn" aria-label="Alerts">🔔<span id="alertCount" class="badge" hidden></span></a>
    <button class="btn ghost small" id="logoutBtn">Sign out</button>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
