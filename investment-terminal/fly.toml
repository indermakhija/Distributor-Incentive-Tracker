app = "nifty-analysis"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DB_FILE = "/data/terminal.db"
  COOKIE_SECURE = "1"
  TRUST_PROXY = "1"
  PUBLIC_URL = "https://nifty-analysis.fly.dev"
  EMBED_ALLOWED_ORIGINS = "https://nifty-terminal.fly.dev"
  SIGNUP_MODE = "first-only"
  TZ = "Asia/Kolkata"
  # EMBED_SECRET is a Fly secret (fly secrets set EMBED_SECRET=...). Never commit it.

[[mounts]]
  source = "ana_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "60s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
